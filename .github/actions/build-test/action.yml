name: Build native wrapper and test
description: Build CMake wrapper, stage libkafka, optionally run precompile/tests and package an asset.

inputs:
  julia-version:
    description: 'Julia version'
    required: true
  julia-arch:
    description: 'Julia architecture (x64|x86|aarch64|default)'
    required: false
    default: 'default'
  project-dir:
    description: 'Path to Julia project (directory with Project.toml)'
    required: false
    default: '.'
  cmake-source-dir:
    description: 'CMake source directory'
    required: false
    default: 'deps/src'
  cmake-build-dir:
    description: 'CMake build directory'
    required: false
    default: 'deps/src/build'
  stage-dir:
    description: 'Where to copy built native library'
    required: false
    default: 'deps/lib'
  lib-ext:
    description: 'Native library extension (so|dylib|dll)'
    required: true
  run-precompile:
    description: 'Run Pkg.precompile() (true|false)'
    required: false
    default: 'false'
  run-tests:
    description: 'Run Pkg.test() (true|false)'
    required: false
    default: 'true'
  max-glibc:
    description: 'Linux only: fail if the built library needs a GLIBC version above this (e.g. 2.36); empty = no check'
    required: false
    default: ''
  package-asset:
    description: 'Create tar.gz and upload as artifact (true|false)'
    required: false
    default: 'false'
  asset-name:
    description: 'Base name for the tar.gz (without extension)'
    required: false
    default: ''
  artifact-name:
    description: 'Artifact name (defaults to asset-name)'
    required: false
    default: ''

outputs:
  libkafka-path:
    description: 'Resolved path to built libkafka.*'
    value: ${{ steps.stage.outputs.libkafka_path }}
  asset-path:
    description: 'Path to generated tar.gz (if package-asset=true)'
    value: ${{ steps.package.outputs.asset_path }}

runs:
  using: composite
  steps:
    # The job may run inside a bare container (see workflow-config.yml, platform.container):
    # the toolchain the runner image normally provides has to be installed first.
    - name: Install build toolchain (Debian container)
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail
        if command -v cmake >/dev/null && command -v g++ >/dev/null && command -v objdump >/dev/null; then
          echo "toolchain present"; exit 0
        fi
        if ! command -v apt-get >/dev/null; then
          echo "ERROR: cmake/g++ missing and apt-get unavailable"; exit 1
        fi
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          build-essential cmake git curl ca-certificates tar gzip xz-utils pkg-config binutils
    - uses: julia-actions/setup-julia@v2
      with:
        version: ${{ inputs.julia-version }}
        arch: ${{ inputs.julia-arch }}

    - uses: julia-actions/cache@v2

    - name: Instantiate Julia dependencies (without precompile)
      shell: bash
      env:
        JULIA_PKG_PRECOMPILE_AUTO: 0
      run: julia --project="${{ inputs.project-dir }}" -e 'using Pkg; Pkg.instantiate()'

    - name: Build native wrapper (CMake)
      shell: bash
      run: |
        set -euo pipefail
        cmake -S "${{ inputs.cmake-source-dir }}" -B "${{ inputs.cmake-build-dir }}" -DCMAKE_BUILD_TYPE=Release
        cmake --build "${{ inputs.cmake-build-dir }}" --config Release

    - name: Stage native library for Julia
      id: stage
      shell: bash
      env:
        LIB_EXT: ${{ inputs.lib-ext }}
      run: |
        set -euo pipefail
        mkdir -p "${{ inputs.stage-dir }}"

        libpath="${{ inputs.cmake-build-dir }}/lib/libkafka.${LIB_EXT}"
        if [[ ! -f "$libpath" ]]; then
          libpath="$(find "${{ inputs.cmake-build-dir }}" -type f -name "libkafka.${LIB_EXT}" -print -quit || true)"
        fi

        if [[ -z "${libpath:-}" ]]; then
          echo "ERROR: libkafka.${LIB_EXT} not found under ${{ inputs.cmake-build-dir }}"
          find "${{ inputs.cmake-build-dir }}" -maxdepth 6 -type f -print
          exit 1
        fi

        cp "$libpath" "${{ inputs.stage-dir }}/"
        echo "libkafka_path=$libpath" >> "$GITHUB_OUTPUT"
    - name: Check GLIBC requirement of the built library
      if: ${{ runner.os == 'Linux' && inputs.max-glibc != '' }}
      shell: bash
      run: |
        set -euo pipefail
        lib="${{ steps.stage.outputs.libkafka_path }}"
        need="$(objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -t. -k1,1n -k2,2n -k3,3n | uniq | tail -1)"
        echo "libkafka.so needs GLIBC_${need}, allowed up to ${{ inputs.max-glibc }}"
        if [[ "$(printf '%s\n%s\n' "$need" "${{ inputs.max-glibc }}" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)" != "${{ inputs.max-glibc }}" ]]; then
          echo "ERROR: the library requires GLIBC_${need}, newer than ${{ inputs.max-glibc }} — build it in the bookworm container (workflow-config.yml)"
          exit 1
        fi

    - name: Precompile project
      if: ${{ inputs.run-precompile == 'true' }}
      shell: bash
      run: julia --project="${{ inputs.project-dir }}" -e 'using Pkg; Pkg.precompile()'

    - name: Run tests
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: julia --project="${{ inputs.project-dir }}" -e 'using Pkg; Pkg.test()'

    - name: Package asset
      id: package
      if: ${{ inputs.package-asset == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${{ inputs.asset-name }}" ]]; then
          echo "ERROR: asset-name is required when package-asset=true"
          exit 1
        fi
        asset="${{ inputs.asset-name }}.tar.gz"
        mkdir -p dist
        cp "${{ steps.stage.outputs.libkafka_path }}" dist/
        tar -czf "$asset" -C dist .
        echo "asset_path=$asset" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v4
      if: ${{ inputs.package-asset == 'true' }}
      with:
        name: ${{ inputs.artifact-name != '' && inputs.artifact-name || inputs.asset-name }}
        path: ${{ steps.package.outputs.asset_path }}
