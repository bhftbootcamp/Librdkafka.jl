name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag and version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag format (numeric semver)
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: invalid tag format: $tag"
            exit 1
          fi

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Read Project.toml version
        id: meta
        run: |
          set -euo pipefail
          version="$(julia -e 'using TOML; print(TOML.parsefile("Project.toml")["version"])')"
          tag="${GITHUB_REF_NAME}"
          if [[ "v$version" != "$tag" ]]; then
            echo "ERROR: tag ($tag) does not match Project.toml version (v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build_test_package:
    name: Build+Test+Package (matrix)
    needs: validate
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1.11', '1.12']
        platform:
          - os: ubuntu-24.04
            arch: x64
            platform: linux-x86_64
            lib_ext: so
          - os: macos-15
            arch: arm64
            platform: macos-aarch64
            lib_ext: dylib
          # - os: macos-15-intel
          #   arch: x64
          #   platform: macos-x86_64
          #   lib_ext: dylib
    steps:
      - uses: actions/checkout@v6
      - name: Build, test, and package
        uses: ./.github/actions/build-test
        with:
          julia-version: ${{ matrix.julia }}
          julia-arch: ${{ matrix.platform.arch }}
          lib-ext: ${{ matrix.platform.lib_ext }}
          run-precompile: 'false'
          run-tests: 'true'
          package-asset: 'true'
          asset-name: ${{ matrix.platform.platform }}-julia${{ matrix.julia }}
          artifact-name: ${{ matrix.platform.platform }}-julia${{ matrix.julia }}

  publish:
    name: Publish GitHub Release
    needs: [validate, build_test_package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release
          mv artifacts/*/*.tar.gz release/
          ls -lh release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          files: release/*.tar.gz
          generate_release_notes: true
