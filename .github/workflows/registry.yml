name: Registry (Green) and Tag

on:
  push:
    branches: [master]
    paths:
      - Project.toml
  workflow_dispatch:

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke_test:
    name: Smoke test before registry/tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1.11', '1.12']
    steps:
      - uses: actions/checkout@v6
      - name: Build and test (Linux x86_64)
        uses: ./.github/actions/build-test
        with:
          julia-version: ${{ matrix.julia }}
          julia-arch: x64
          lib-ext: so
          run-precompile: 'true'
          run-tests: 'true'

  register_and_tag:
    name: Update Green registry and create tag
    runs-on: ubuntu-24.04
    needs: smoke_test
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ensure branch is master
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "ERROR: registry/tag workflow must run on master, got: ${GITHUB_REF}"
            exit 1
          fi

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - uses: julia-actions/cache@v2

      - name: Add Green registry
        uses: julia-actions/add-julia-registry@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          registry: bhftbootcamp/Green

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install LocalRegistry
        run: julia -e 'using Pkg; Pkg.add("LocalRegistry")'

      - name: Dev current package
        run: julia -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd()))'

      - name: Determine package name and version
        id: meta
        run: |
          set -euo pipefail
          name="$(julia -e 'using TOML; print(TOML.parsefile("Project.toml")["name"])')"
          version="$(julia -e 'using TOML; print(TOML.parsefile("Project.toml")["version"])')"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Project.toml version must be numeric semver (MAJOR.MINOR.PATCH), got: $version"
            exit 1
          fi

          tag="v$version"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Update Green registry entry
        env:
          PKG_NAME: ${{ steps.meta.outputs.name }}
        run: |
          set -euo pipefail
          julia -e '
            using LocalRegistry
            LocalRegistry.register(
              ENV["PKG_NAME"];
              repo = "https://github.com/${{ github.repository }}.git",
              registry = "git@github.com:bhftbootcamp/Green.git",
              ignore_reregistration = true,
            )
          '

      - name: Create and push tag (no force)
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          head="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            tagged="$(git rev-list -n 1 "${TAG}")"
            if [[ "$tagged" != "$head" ]]; then
              echo "ERROR: tag ${TAG} already exists and points to ${tagged}, current commit is ${head}"
              echo "Hint: bump Project.toml version"
              exit 1
            fi
            echo "OK: tag ${TAG} already exists on this commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"
