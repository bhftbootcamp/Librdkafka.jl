name: CI - Build and Test

on:
  push:
    tags-ignore: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read
  pull-requests: read

jobs:
  config:
    name: Load Workflow Config
    runs-on: ubuntu-24.04
    outputs:
      build_matrix: ${{ steps.config.outputs.build_matrix }}
      ci_filters: ${{ steps.config.outputs.ci_filters }}
    steps:
      - uses: actions/checkout@v6
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pyyaml-v1
      - name: Install PyYAML
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml
      - id: config
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import yaml

          cfg = yaml.safe_load(Path(".github/workflow-config.yml").read_text(encoding="utf-8"))
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write(f"build_matrix={json.dumps(cfg['build_matrix'])}\n")
              f.write("ci_filters<<EOF\n")
              f.write("relevant:\n")
              for p in cfg["ci_paths"]:
                  f.write(f"  - '{p}'\n")
              f.write("EOF\n")
          PY

  changes:
    name: Detect Relevant Changes
    needs: config
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: ${{ needs.config.outputs.ci_filters }}

  build_test:
    name: Build and Test
    needs: [config, changes]
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.config.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        uses: ./.github/actions/build-test
        with:
          julia-version: ${{ matrix.julia }}
          julia-arch: ${{ matrix.platform.arch }}
          lib-ext: ${{ matrix.platform.lib_ext }}
          run-precompile: 'true'
          run-tests: 'true'

  integration_test:
    name: Integration Tests (broker)
    needs: [config, changes]
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
    steps:
      - uses: actions/checkout@v6
      - name: Start Redpanda broker
        run: docker compose -f test/docker-compose.yml up -d --wait
      - name: Build and test against broker
        uses: ./.github/actions/build-test
        with:
          julia-version: '1.10'
          lib-ext: so
          run-precompile: 'true'
          run-tests: 'true'
      - name: Broker logs (on failure)
        if: failure()
        run: docker compose -f test/docker-compose.yml logs
      - name: Stop broker
        if: always()
        run: docker compose -f test/docker-compose.yml down -v

  gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    needs: [config, changes, build_test, integration_test]
    if: ${{ always() }}
    steps:
      - name: Decide
        shell: bash
        run: |
          set -euo pipefail
          echo "relevant_changes=${{ needs.changes.outputs.relevant }}"
          echo "build_test_result=${{ needs.build_test.result }}"
          echo "integration_test_result=${{ needs.integration_test.result }}"

          if [[ "${{ needs.changes.outputs.relevant }}" == "true" ]]; then
            if [[ "${{ needs.build_test.result }}" != "success" ]]; then
              echo "ERROR: build/test failed"
              exit 1
            fi
            if [[ "${{ needs.integration_test.result }}" != "success" ]]; then
              echo "ERROR: integration tests failed"
              exit 1
            fi
            echo "OK: build/test and integration_test passed"
          else
            echo "OK: no relevant changes; build/test skipped"
          fi
